<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SignalForge turns authorized security scope notes into a focused review queue, authorization matrix, and report draft.">
    <meta property="og:title" content="SignalForge">
    <meta property="og:description" content="Scope to signal for authorized security review planning.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://signalforge-lab.onrender.com/">
    <title>SignalForge</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="privacy" href="/privacy.txt">
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="SignalForge workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">SignalForge</p>
            <h1>Scope to signal</h1>
          </div>
          <div class="top-actions">
            <a class="button-link" href="https://github.com/BondarenkoCom/signalforge-lab/issues/new?template=review-request.yml&title=Review%20request%3A%20authorized%20pilot">Request pilot</a>
            <a class="text-link" href="/pilot.html">Pilot offer</a>
          </div>
        </header>

        <section class="pilot-bar" aria-label="Pilot intake">
          <div>
            <strong>Paid pilot slots</strong>
            <span>authorized planning only</span>
          </div>
          <div>
            <strong>$49-$300</strong>
            <span>triage or review plan</span>
          </div>
          <div>
            <strong>Public-safe intake</strong>
            <span>no secrets or confidential scope</span>
          </div>
        </section>

        <section class="grid">
          <form id="analyze-form" class="panel input-panel">
            <div class="profiles" aria-label="Review profiles">
              <button type="button" class="profile is-active" data-profile="api">API</button>
              <button type="button" class="profile" data-profile="agent">Agent</button>
              <button type="button" class="profile" data-profile="billing">Billing</button>
            </div>

            <label for="scopeText">Scope and rules</label>
            <textarea id="scopeText" name="scopeText" spellcheck="false" placeholder="authorized program scope, rules, endpoint notes, roles, object names"></textarea>

            <label for="notes">Field notes</label>
            <textarea id="notes" name="notes" spellcheck="false" placeholder="owned accounts, states, interfaces, odd behavior"></textarea>

            <div class="actions">
              <button type="submit">Forge</button>
              <button type="button" id="sample-button" class="secondary">Sample</button>
              <button type="button" id="clear-button" class="secondary">Clear</button>
            </div>
          </form>

          <section class="panel output-panel" aria-live="polite">
            <div class="tabs" role="tablist">
              <button type="button" class="tab is-active" data-tab="queue">Queue</button>
              <button type="button" class="tab" data-tab="matrix">Matrix</button>
              <button type="button" class="tab" data-tab="report">Report</button>
              <button type="button" id="copy-button" class="secondary">Copy</button>
              <button type="button" id="download-button" class="secondary">Download</button>
            </div>

            <div id="summary" class="summary"></div>
            <div id="queue" class="tab-view is-active"></div>
            <div id="matrix" class="tab-view"></div>
            <pre id="report" class="tab-view report"></pre>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
