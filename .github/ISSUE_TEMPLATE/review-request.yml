name: Review request
description: Request a focused authorized security review plan.
title: "Review request: "
labels:
  - review-request
body:
  - type: markdown
    attributes:
      value: |
        Use only assets you own or are explicitly authorized to test.
        Do not include secrets, private tokens, confidential program details, third-party personal data, or exploit instructions.
  - type: input
    id: contact
    attributes:
      label: Contact
      description: Email, Telegram, Discord, or another way to reply.
      placeholder: name@example.com
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Program scope
      description: Public-safe assets, roles, rules, out-of-scope items, and safe-harbor notes. Keep private details for a separate channel after acceptance.
      placeholder: |
        Assets:
        Roles:
        Authentication:
        Data sensitivity:
        Out of scope:
        Rate limits:
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What kind of signal do you need first?
      placeholder: API auth matrix, LLM tool-use review, export/download checks, invite/share flow audit
    validations:
      required: true
  - type: dropdown
    id: pilot
    attributes:
      label: Pilot size
      options:
        - Free sanity check
        - Paid quick triage ($49-$99)
        - Paid review plan ($150-$300)
        - Custom
    validations:
      required: true
  - type: dropdown
    id: payment
    attributes:
      label: Payment rail after acceptance
      description: No payment is requested until authorization, scope, and deliverable are accepted.
      options:
        - Not set yet
        - Invoice after scope accepted
        - Crypto after scope accepted
        - Other after scope accepted
    validations:
      required: true
  - type: dropdown
    id: urgency
    attributes:
      label: Urgency
      options:
        - 24 hours
        - 3 days
        - 1 week
        - exploratory
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public safety confirmation
      options:
        - label: I confirm this request is authorized and contains no secrets or confidential target details.
          required: true
